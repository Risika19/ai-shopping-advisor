{% extends 'base.html' %}
{% block title %}Login - AI Shopping Advisor{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right display-4 text-primary"></i>
                    <h3 class="fw-bold mt-2">Welcome Back</h3>
                    <p class="text-muted small">Login to your account</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Login</button>
                </form>
                <p class="text-center mt-3 mb-0 small">Don't have an account? <a href="{% url 'register' %}" class="fw-semibold">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
