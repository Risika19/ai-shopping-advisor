{% extends 'base.html' %}
{% block title %}Profile - AI Shopping Advisor{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle display-4 text-primary"></i>
                    <h3 class="fw-bold mt-2">My Profile</h3>
                    <p class="text-muted small">Manage your account details</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100 rounded-pill py-2">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
