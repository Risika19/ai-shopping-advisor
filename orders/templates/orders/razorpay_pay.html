{% extends 'base.html' %}
{% load static %}
{% block title %}Payment - ShopAI{% endblock %}
{% block content %}
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-credit-card-2-front display-1 text-primary"></i>
                </div>
                <h3 class="fw-bold mb-2">Complete Payment</h3>
                <p class="text-muted mb-4">Order: {{ order.order_id }}</p>
                <h2 class="fw-bold text-primary mb-4">Rs {{ order.total|floatformat:0 }}</h2>

                <button id="rzp-button" class="btn btn-premium btn-lg w-100 py-3">
                    <i class="bi bi-lock-fill"></i> Pay Rs {{ order.total|floatformat:0 }}
                </button>
                <p class="text-muted small mt-3">
                    <i class="bi bi-shield-check"></i> Secured by Razorpay
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ razorpay_amount }}",
    "currency": "INR",
    "name": "ShopAI",
    "description": "Order {{ order.order_id }}",
    "order_id": "{{ razorpay_order_id }}",
    "prefill": {
        "name": "{{ user_name }}",
        "email": "{{ user_email }}",
        "contact": "{{ user_phone }}"
    },
    "theme": {
        "color": "#6c63ff"
    },
    "handler": function(response) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '{% url "razorpay_callback" %}';
        form.innerHTML = '{% csrf_token %}';
        form.innerHTML += '<input type="hidden" name="razorpay_payment_id" value="' + response.razorpay_payment_id + '">';
        form.innerHTML += '<input type="hidden" name="razorpay_order_id" value="' + response.razorpay_order_id + '">';
        form.innerHTML += '<input type="hidden" name="razorpay_signature" value="' + response.razorpay_signature + '">';
        document.body.appendChild(form);
        form.submit();
    },
    "modal": {
        "ondismiss": function() {
            window.location.href = '{% url "payment_failed" order.pk %}';
        }
    }
};
var rzp = new Razorpay(options);
document.getElementById('rzp-button').onclick = function(e) {
    rzp.open();
    e.preventDefault();
};
</script>
{% endblock %}
